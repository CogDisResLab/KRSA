name: R Build Check with rworkflows
on:
  workflow_dispatch:
  push:
    branches:
    - devel
    - RELEASE_**
  pull_request:
    branches:
    - devel
    - RELEASE_**
jobs:
  rworkflows:
    permissions:
      contents: write
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    container: ${{ matrix.config.cont }}
    strategy:
      fail-fast: ${{ false }}
      matrix:
        config:
        - os: ubuntu-latest
          bioc: devel
          r: auto
          cont: bioconductor/bioconductor_docker:devel
          rspm: https://packagemanager.rstudio.com/cran/__linux__/latest/release
        - os: macOS-latest
          bioc: release
          r: auto
        - os: windows-latest
          bioc: release
          r: auto
    steps:
    - run: apt-get update && apt-get install -y rsync qpdf
      if: runner.os == 'Linux'
    - uses: neurogenomics/rworkflows@master
      with:
        run_bioccheck: ${{ false }}
        run_rcmdcheck: ${{ false }}
        as_cran: ${{ true }}
        run_vignettes: ${{ false }}
        has_testthat: ${{ false }}
        run_covr: ${{ false }}
        run_pkgdown: ${{ false }}
        has_runit: ${{ false }}
        has_latex: ${{ false }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run_docker: ${{ false }}
        runner_os: ${{ runner.os }}
        cache_version: cache-v1
